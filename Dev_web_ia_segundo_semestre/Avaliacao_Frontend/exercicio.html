<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles/exercicio.css">
</head>

<body>

    <header>
        <h2>Avaliação Front</h2>

        <nav>
            <a href="index.html">Login</a>
            <a href="sobre.html">Sobre</a>
            <a href="exercicio.html">Exercício</a>
        </nav>
    </header>

    <main>

        <h1>Calculadora</h1>

        <input type="number" id="numero1" placeholder="Primeiro número">

        <input type="number" id="numero2" placeholder="Segundo número">

        <button onclick="calcular()">Calcular</button>

        <h2>Resultado</h2>

        <p id="resultado">O resultado aparecerá aqui</p>

    </main>

    <script>

        function calcular() {

            let numero1 = Number(document.getElementById("numero1").value);
            let numero2 = Number(document.getElementById("numero2").value);

            let soma = numero1 + numero2;
            let subtracao = numero1 - numero2;
            let multiplicacao = numero1 * numero2;
            let divisao = numero1 / numero2;

            document.getElementById("resultado").innerHTML =
                "Soma: " + soma +
                "<br>Subtração: " + subtracao +
                "<br>Multiplicação: " + multiplicacao +
                "<br>Divisão: " + divisao;
        }

    </script>

</body>

</html>
