<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Login</title>
    <link rel="stylesheet" href="./styles/exercicio1.css">
</head>

<body>

    <main>

        <section class="login">

            <h1>Login</h1>

            <form>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha">
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p class="esqueceu">
                Esqueceu sua <a href="#">Senha?</a>
            </p>

            <p>
                Não tem uma conta?
                <a href="#">Cadastre-se</a>
            </p>
        </section>

    </main>

</body>

</html>
