<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Sign In</title>
    <link rel="stylesheet" href="./styles/exercicio2.css">
</head>

<body>

    <main>

        <section class="login">

            <div class="formulario">

                <h1>Entrar</h1>

                <p>
                    Kaue gatão.
                </p>

                <form>

                    <input
                        type="text"
                        placeholder="Nome de usuário"
                    >

                    <input
                        type="password"
                        placeholder="Senha"
                    >

                    <div class="opcoes">

                        <label>
                            <input type="checkbox">
                            Lembrar-me
                        </label>

                        <a href="#">
                            Esqueceu sua senha?
                        </a>

                    </div>

                    <button class="entrar">
                        Entrar
                    </button>

                </form>

                <p class="ou">
                    Ou
                </p>

                <button class="facebook">
                    Login com Facebook
                </button>

                <button class="twitter">
                    Login com Twitter
                </button>

                <button class="google">
                    Login com Google
                </button>

            </div>


            <div class="imagem">

                <img
                    src="./imgs/mulher.png"
                    alt="Mulher na cidade"
                >

            </div>

        </section>

    </main>

</body>

</html>
