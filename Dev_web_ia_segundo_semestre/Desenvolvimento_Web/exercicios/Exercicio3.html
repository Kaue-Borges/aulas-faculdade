<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastre e concorra!</title>

    <link rel="stylesheet" href="./styles/exercicio3.css">
</head>

<body>

    <main>

        <section class="lado-formulario">

            <div class="cadastro">

                <h1>➜ Cadastre e concorra!</h1>

                <p>
                    Preencha o formulário e concorra a uma viagem dos sonhos
                    para você mais um acompanhante para o local de sua escolha!
                </p>

                <form>

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                        >
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de Nascimento</label>
                        <input
                            type="date"
                            id="nascimento"
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            placeholder="Digite seu CPF"
                        >
                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input
                                type="text"
                                id="cep"
                                placeholder="Digite seu CEP"
                            >
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <input
                                type="text"
                                id="estado"
                                placeholder="Digite seu estado"
                            >
                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input
                                type="text"
                                id="cidade"
                                placeholder="Digite sua cidade"
                            >
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input
                                type="text"
                                id="bairro"
                                placeholder="Digite seu bairro"
                            >
                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="rua">Rua</label>
                            <input
                                type="text"
                                id="rua"
                                placeholder="Digite sua rua"
                            >
                        </div>

                        <div class="campo">
                            <label for="complemento">Complemento</label>
                            <input
                                type="text"
                                id="complemento"
                                placeholder="Digite o complemento"
                            >
                        </div>

                    </div>

                    <button type="submit">
                        CADASTRAR
                    </button>

                </form>

            </div>

        </section>


        <section class="lado-imagem">

        </section>

    </main>

</body>

</html>
